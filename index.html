<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HID Lab — Live Instrument Utility</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Orbitron:wght@400..900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* ============================================================
   HID LAB  —  Designed by Mario Garcia
   Retro-cyberpunk live instrument utility
   ============================================================ */

:root{
  --bg:#04060a;
  --bg2:#080c14;
  --panel:rgba(10,16,26,0.82);
  --panel-solid:#0a1018;
  --neon:#00f0ff;        /* primary accent */
  --neon2:#ff2bd6;       /* secondary accent */
  --neon3:#b6ff3a;       /* tertiary */
  --text:#d6f4ff;
  --muted:#6f8aa0;
  --line:rgba(0,240,255,0.22);
  --white-key:#e9f8ff;
  --black-key:#06121a;
  --glow:1;              /* glow multiplier */
  --bright:1;            /* brightness multiplier */
  --radius:10px;
  --grid:linear-gradient(rgba(0,240,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,0.04) 1px,transparent 1px);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Rajdhani',sans-serif;
  filter:brightness(var(--bright));
  user-select:none;
  -webkit-user-select:none;
  touch-action:manipulation;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select{font-family:'Share Tech Mono',monospace;color:var(--text)}

/* glow helpers */
.neon-text{color:var(--neon);text-shadow:0 0 calc(6px*var(--glow)) var(--neon),0 0 calc(18px*var(--glow)) rgba(0,240,255,.6)}
.scan::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.18) 2px 3px);mix-blend-mode:overlay;opacity:.4}

/* ===================== HOME SCREEN ===================== */
#home{
  position:fixed;inset:0;z-index:500;overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 120%,rgba(255,43,214,.18),transparent 55%),
    radial-gradient(ellipse at 50% -10%,rgba(0,240,255,.18),transparent 55%),
    var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .8s ease, transform .8s ease;
}
#home.lifting{opacity:0;transform:scale(1.15);pointer-events:none}
.home-grid{
  position:absolute;inset:-50% 0 0 0;height:160%;
  background-image:var(--grid);background-size:46px 46px;
  transform:perspective(420px) rotateX(64deg);
  transform-origin:50% 100%;
  mask-image:linear-gradient(to top,#000 0%,rgba(0,0,0,.5) 35%,transparent 78%);
  animation:gridrun 7s linear infinite;opacity:.85;
}
@keyframes gridrun{from{background-position-y:0}to{background-position-y:46px}}
.home-sun{
  position:absolute;top:14%;left:50%;width:min(60vw,540px);height:min(60vw,540px);
  transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(circle at 50% 60%,rgba(255,43,214,.30),rgba(0,240,255,.06) 60%,transparent 70%);
  filter:blur(8px);animation:pulse 5s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.7;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.04)}}

.home-inner{position:relative;z-index:3;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px;max-width:920px}
.logo{
  font-family:'Pirata One',serif;
  font-size:clamp(64px,15vw,168px);line-height:.9;letter-spacing:2px;
  background:linear-gradient(180deg,#eafdff 0%,var(--neon) 45%,var(--neon2) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 calc(14px*var(--glow)) rgba(0,240,255,.85)) drop-shadow(0 0 calc(34px*var(--glow)) rgba(255,43,214,.55));
  animation:flicker 6s infinite;
}
.logo .dot{color:var(--neon2);-webkit-text-fill-color:var(--neon2)}
@keyframes flicker{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.7}94%{opacity:1}96%{opacity:.85}97%{opacity:1}}
.byline{font-family:'Share Tech Mono',monospace;font-size:clamp(11px,1.6vw,15px);letter-spacing:5px;color:var(--neon);opacity:.8;text-transform:uppercase}
.tag{font-family:'Orbitron',sans-serif;font-weight:600;font-size:clamp(13px,2.1vw,20px);margin-top:22px;color:#cfefff;letter-spacing:1px}
.tag .hi{color:var(--neon2);text-shadow:0 0 10px var(--neon2)}
.subtag{font-size:clamp(12px,1.7vw,16px);color:var(--muted);max-width:540px;margin-top:8px;letter-spacing:.5px}

/* waveform display on home */
.home-scope{position:relative;z-index:3;margin-top:30px;width:min(86vw,640px);height:120px;
  border:1px solid var(--line);border-radius:12px;overflow:hidden;
  background:linear-gradient(180deg,rgba(0,240,255,.05),rgba(255,43,214,.05));
  box-shadow:0 0 calc(26px*var(--glow)) rgba(0,240,255,.25),inset 0 0 40px rgba(0,0,0,.6)}
.home-scope canvas{width:100%;height:100%;display:block}

/* LAUNCH button */
.launch-wrap{position:relative;z-index:4;margin-top:42px}
.launch{
  position:relative;font-family:'Orbitron',sans-serif;font-weight:800;
  font-size:clamp(18px,3vw,26px);letter-spacing:6px;color:#02151a;
  padding:20px 64px;border-radius:50px;text-transform:uppercase;
  background:linear-gradient(90deg,var(--neon),#7df9ff,var(--neon));
  background-size:200% 100%;
  box-shadow:0 0 calc(20px*var(--glow)) var(--neon),0 0 calc(60px*var(--glow)) rgba(0,240,255,.5),inset 0 0 18px rgba(255,255,255,.6);
  animation:launchpulse 2.6s ease-in-out infinite, launchshift 4s linear infinite;
  transition:transform .15s;
}
.launch:hover{transform:scale(1.06)}
.launch:active{transform:scale(.97)}
@keyframes launchpulse{0%,100%{box-shadow:0 0 calc(20px*var(--glow)) var(--neon),0 0 calc(55px*var(--glow)) rgba(0,240,255,.45),inset 0 0 18px rgba(255,255,255,.6)}50%{box-shadow:0 0 calc(34px*var(--glow)) var(--neon),0 0 calc(90px*var(--glow)) rgba(0,240,255,.7),inset 0 0 26px rgba(255,255,255,.85)}}
@keyframes launchshift{to{background-position:200% 0}}
.launch::before{content:"";position:absolute;inset:-6px;border-radius:50px;border:1px solid var(--neon);opacity:.5;animation:ring 2.6s ease-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.25);opacity:0}}

/* floating synth illustration knobs/sliders on home */
.home-synth{position:absolute;z-index:2;bottom:6%;left:50%;transform:translateX(-50%);
  display:flex;gap:18px;align-items:flex-end;opacity:.9;flex-wrap:wrap;justify-content:center;width:min(90vw,720px)}
.hk{width:46px;height:46px;border-radius:50%;border:2px solid var(--neon);position:relative;
  background:radial-gradient(circle at 50% 35%,rgba(0,240,255,.25),rgba(0,0,0,.6));
  box-shadow:0 0 calc(10px*var(--glow)) rgba(0,240,255,.5)}
.hk::after{content:"";position:absolute;left:50%;top:6px;width:2px;height:14px;background:var(--neon2);transform-origin:bottom;box-shadow:0 0 6px var(--neon2)}
.hk:nth-child(1)::after{transform:translateX(-50%) rotate(-50deg)}
.hk:nth-child(2)::after{transform:translateX(-50%) rotate(20deg)}
.hk:nth-child(3)::after{transform:translateX(-50%) rotate(120deg)}
.hk:nth-child(4)::after{transform:translateX(-50%) rotate(-15deg)}
.hs{width:14px;height:70px;border-radius:8px;border:1px solid var(--line);position:relative;background:rgba(0,240,255,.06)}
.hs .cap{position:absolute;left:-3px;width:20px;height:12px;border-radius:3px;background:var(--neon2);box-shadow:0 0 8px var(--neon2)}
/* ===================== APP SHELL ===================== */
#app{position:fixed;inset:0;display:none;flex-direction:column;
  background:
    radial-gradient(ellipse at 0% 0%,rgba(0,240,255,.06),transparent 40%),
    radial-gradient(ellipse at 100% 100%,rgba(255,43,214,.06),transparent 40%),
    var(--bg);
}
#app.on{display:flex}
#app::before{content:"";position:absolute;inset:0;background-image:var(--grid);background-size:40px 40px;opacity:.5;pointer-events:none}

/* TOP BAR */
#topRegion{position:relative;z-index:40;flex:none;overflow:hidden;transition:none;padding-top:env(safe-area-inset-top,0)}
#topRegion.hidden{display:none}
#topbar{position:relative;z-index:40;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:8px 12px;padding-right:158px;background:linear-gradient(180deg,rgba(8,14,22,.96),rgba(8,14,22,.78));
  border-bottom:1px solid var(--line);box-shadow:0 4px 24px rgba(0,0,0,.6)}
.brandmini{font-family:'Pirata One',serif;font-size:26px;letter-spacing:1px;
  background:linear-gradient(180deg,#eafdff,var(--neon));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 8px rgba(0,240,255,.7));padding-right:6px}
.tb-group{display:flex;align-items:center;gap:8px;padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:rgba(0,0,0,.25)}
.tb-label{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:1px;color:var(--neon);opacity:.8;text-transform:uppercase}
.tb-val{font-family:'Share Tech Mono',monospace;font-size:14px;color:#fff;min-width:42px;text-align:center}
.btn{font-family:'Orbitron',sans-serif;font-weight:600;font-size:11px;letter-spacing:1px;
  padding:7px 11px;border:1px solid var(--line);border-radius:7px;background:rgba(0,240,255,.05);
  color:var(--text);text-transform:uppercase;transition:.15s;white-space:nowrap}
.btn:hover{background:rgba(0,240,255,.16);box-shadow:0 0 12px rgba(0,240,255,.35);border-color:var(--neon)}
.btn.active{background:var(--neon);color:#021;box-shadow:0 0 16px var(--neon)}
.btn.armed{background:var(--neon2);color:#1a0014;box-shadow:0 0 16px var(--neon2)}
.btn.off{opacity:.55;border-color:#445;color:#7788a0}
.btn.off:hover{box-shadow:none;border-color:#556}
.btn.kill:hover{background:var(--neon2);color:#1a0014;box-shadow:0 0 20px var(--neon2)}
.btn.sm{padding:5px 8px;font-size:10px}

/* horizontal slider in topbar */
.hslider{-webkit-appearance:none;appearance:none;width:120px;height:6px;border-radius:6px;
  background:linear-gradient(90deg,var(--neon),var(--neon2));outline:none;cursor:pointer}
.hslider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:#fff;box-shadow:0 0 10px var(--neon);border:2px solid var(--neon)}
.hslider::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--neon);box-shadow:0 0 10px var(--neon)}

.tb-spacer{flex:1}

/* DOCK (window launcher buttons) */
#dock{position:relative;z-index:30;display:flex;gap:7px;flex-wrap:wrap;padding:7px 12px;
  border-bottom:1px solid rgba(0,240,255,.12);background:rgba(4,8,14,.6)}

/* DESKTOP */
#desktop{position:relative;flex:1;overflow:hidden}

/* WINDOWS */
.win{position:absolute;min-width:240px;min-height:140px;display:flex;flex-direction:column;
  background:var(--panel);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  box-shadow:0 0 calc(22px*var(--glow)) rgba(0,240,255,.18),0 12px 40px rgba(0,0,0,.7);
  animation:winpop .22s ease}
@keyframes winpop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.win.focused{border-color:var(--neon);box-shadow:0 0 calc(30px*var(--glow)) rgba(0,240,255,.35),0 14px 44px rgba(0,0,0,.8)}
.win-bar{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:grab;
  background:linear-gradient(180deg,rgba(0,240,255,.12),rgba(0,240,255,.02));
  border-bottom:1px solid var(--line);touch-action:none}
.win-bar:active{cursor:grabbing}
.win-title{font-family:'Orbitron',sans-serif;font-weight:700;font-size:12px;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--neon);flex:1;text-shadow:0 0 8px rgba(0,240,255,.5);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.win-dot{width:12px;height:12px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.3);display:grid;place-items:center;font-size:9px;color:var(--text)}
.win-dot.close{border-color:var(--neon2)}
.win-dot.close:hover{background:var(--neon2);color:#1a0014}
.win-dot.min:hover{background:var(--neon3);color:#0a1500}
.win-body{flex:1;overflow:auto;padding:12px;scrollbar-width:thin;scrollbar-color:var(--neon) transparent}
.win-body::-webkit-scrollbar{width:8px;height:8px}
.win-body::-webkit-scrollbar-thumb{background:rgba(0,240,255,.4);border-radius:8px}
.win-resize{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;
  background:linear-gradient(135deg,transparent 50%,var(--neon) 50%);opacity:.5;border-bottom-right-radius:var(--radius)}
.win.min .win-body,.win.min .win-resize{display:none}

/* knobs */
.knob-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:14px}
.knob{display:flex;flex-direction:column;align-items:center;gap:6px}
.knob .dial{width:58px;height:58px;border-radius:50%;position:relative;cursor:ns-resize;touch-action:none;
  background:radial-gradient(circle at 50% 38%,#10202c,#04080c);
  border:2px solid var(--line);box-shadow:0 0 calc(10px*var(--glow)) rgba(0,240,255,.3),inset 0 -6px 12px rgba(0,0,0,.7)}
.knob .dial::before{content:"";position:absolute;left:50%;top:5px;width:3px;height:18px;border-radius:3px;
  background:var(--neon);box-shadow:0 0 8px var(--neon);transform-origin:50% 24px;transform:translateX(-50%) rotate(var(--rot,0deg))}
.knob .dial .arc{position:absolute;inset:-4px;border-radius:50%;pointer-events:none}
.knob .lbl{font-family:'Share Tech Mono',monospace;font-size:9.5px;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;text-align:center}
.knob .num{font-family:'Share Tech Mono',monospace;font-size:10px;color:#fff}

/* vertical sliders */
.vsliders{display:flex;gap:16px;flex-wrap:wrap}
.vsl{display:flex;flex-direction:column;align-items:center;gap:6px}
.vsl input[type=range]{-webkit-appearance:none;appearance:none;writing-mode:vertical-lr;direction:rtl;
  width:8px;height:120px;border-radius:8px;background:linear-gradient(0deg,var(--neon2),var(--neon));outline:none;cursor:pointer}
.vsl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:14px;border-radius:4px;background:#fff;border:1px solid var(--neon);box-shadow:0 0 10px var(--neon)}
.vsl input[type=range]::-moz-range-thumb{width:22px;height:14px;border-radius:4px;background:#fff;border:1px solid var(--neon);box-shadow:0 0 10px var(--neon)}
.vsl .lbl{font-family:'Share Tech Mono',monospace;font-size:9.5px;color:var(--muted);text-transform:uppercase}

/* generic rows */
.row{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.row label{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--muted);min-width:74px;text-transform:uppercase;letter-spacing:.5px}
select,.txtin{background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;color:var(--text);outline:none}
select:focus,.txtin:focus{border-color:var(--neon);box-shadow:0 0 8px rgba(0,240,255,.4)}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{flex:1;padding:6px 9px;font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:.5px;background:rgba(0,0,0,.25);text-transform:uppercase}
.seg button.on{background:var(--neon);color:#021;box-shadow:0 0 12px var(--neon)}
.hint{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted);line-height:1.5}

/* EQ canvas */
.eq-canvas{width:100%;height:130px;border:1px solid var(--line);border-radius:8px;background:rgba(0,0,0,.4);display:block}

/* PADS */
.pad-grid{display:grid;gap:9px}
.pad{position:relative;aspect-ratio:1;border-radius:10px;border:1px solid var(--line);
  background:linear-gradient(160deg,rgba(0,240,255,.07),rgba(0,0,0,.5));
  display:flex;flex-direction:column;justify-content:space-between;padding:7px;cursor:pointer;
  transition:transform .08s, box-shadow .12s;overflow:hidden}
.pad:hover{border-color:var(--neon)}
.pad.sel{border-color:var(--neon2);box-shadow:0 0 16px rgba(255,43,214,.5)}
.pad.playing{box-shadow:0 0 22px var(--neon),inset 0 0 18px rgba(0,240,255,.25);border-color:var(--neon)}
.pad.empty{opacity:.6;border-style:dashed}
.pad .pname{font-family:'Share Tech Mono',monospace;font-size:10px;color:#fff;line-height:1.1;word-break:break-word}
.pad .pmeta{font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--neon);opacity:.85;text-transform:uppercase}
.pad .pnum{position:absolute;top:5px;right:7px;font-size:9px;color:var(--muted);font-family:'Share Tech Mono',monospace}
.pad .pkey{position:absolute;bottom:5px;right:7px;font-size:9px;color:var(--neon2);font-family:'Share Tech Mono',monospace}

/* 3D radar */
.radar{position:relative;width:100%;aspect-ratio:1;max-width:300px;margin:0 auto;border-radius:50%;
  border:1px solid var(--line);background:radial-gradient(circle,rgba(0,240,255,.08),rgba(0,0,0,.6));overflow:hidden}
.radar::before,.radar::after{content:"";position:absolute;background:rgba(0,240,255,.15)}
.radar::before{left:50%;top:0;width:1px;height:100%}
.radar::after{top:50%;left:0;height:1px;width:100%}
.radar .ring{position:absolute;border:1px solid rgba(0,240,255,.12);border-radius:50%}
.radar .listener{position:absolute;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%);
  border-radius:50%;background:var(--neon3);box-shadow:0 0 12px var(--neon3)}
.sp-point{position:absolute;width:20px;height:20px;border-radius:50%;transform:translate(-50%,-50%);cursor:grab;
  background:radial-gradient(circle,#fff,var(--neon));box-shadow:0 0 14px var(--neon);border:1px solid #fff;touch-action:none}
.sp-point.active{background:radial-gradient(circle,#fff,var(--neon2));box-shadow:0 0 18px var(--neon2)}
.sp-sweep{position:absolute;left:50%;top:50%;width:50%;height:1px;transform-origin:left center;
  background:linear-gradient(90deg,rgba(0,240,255,.5),transparent);animation:sweep 4s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}

/* PIANO DOCK */
#pianoDock{position:relative;z-index:35;border-top:1px solid var(--line);
  background:linear-gradient(180deg,rgba(8,14,22,.7),rgba(4,7,12,.95));
  box-shadow:0 -6px 30px rgba(0,0,0,.6);transition:transform .35s ease;padding-bottom:env(safe-area-inset-bottom,0)}
#pianoDock.hidden{display:none}
.piano-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 12px;border-bottom:1px solid rgba(0,240,255,.12)}
.kb-wrap{position:relative;height:var(--kb-h,150px);overflow-x:auto;overflow-y:hidden;padding:6px 6px 10px;scrollbar-width:thin}
.kb-wrap::-webkit-scrollbar{height:7px}
.kb-wrap::-webkit-scrollbar-thumb{background:rgba(0,240,255,.4);border-radius:6px}
.keyboard{position:relative;height:100%;display:flex;align-items:flex-end;min-width:max-content}
.wkey{position:relative;height:100%;border:1px solid #0a2230;border-radius:0 0 6px 6px;
  background:linear-gradient(180deg,var(--white-key),#aacede 90%,#7fb0c4);
  box-shadow:inset 0 -10px 14px rgba(0,0,0,.18);margin-right:1px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
.wkey .kl{font-family:'Share Tech Mono',monospace;font-size:8px;color:#06303f;opacity:.55}
.wkey.down{background:linear-gradient(180deg,var(--neon),#a9f6ff);box-shadow:0 0 18px var(--neon),inset 0 0 14px rgba(255,255,255,.6)}
.wkey.build-sel{background:linear-gradient(180deg,var(--neon2),#ff9be8);box-shadow:0 0 18px var(--neon2)}
.bkey{position:absolute;top:0;height:62%;border-radius:0 0 5px 5px;z-index:5;
  background:linear-gradient(180deg,#16323f,var(--black-key));border:1px solid #000;
  box-shadow:inset 0 -6px 8px rgba(255,255,255,.06),0 4px 6px rgba(0,0,0,.6)}
.bkey.down{background:linear-gradient(180deg,var(--neon),#0a6678);box-shadow:0 0 16px var(--neon)}
.bkey.build-sel{background:linear-gradient(180deg,var(--neon2),#7a1060);box-shadow:0 0 16px var(--neon2)}

/* chromatic bar view */
.chroma{display:flex;align-items:stretch;gap:4px;height:100%;min-width:max-content;padding:2px}
.cbar{min-width:46px;border-radius:7px;border:1px solid var(--line);position:relative;cursor:pointer;
  background:linear-gradient(180deg,rgba(0,240,255,.18),rgba(0,0,0,.5));
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px;transition:.08s}
.cbar .cl{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--text)}
.cbar.down{background:linear-gradient(180deg,var(--neon),rgba(0,240,255,.4));box-shadow:0 0 18px var(--neon)}
.cbar.root{border-color:var(--neon2)}

/* pitch wheel */
.pwheel{width:54px;height:120px;border-radius:14px;border:1px solid var(--line);position:relative;
  background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,240,255,.06),rgba(0,0,0,.5));cursor:ns-resize;touch-action:none;flex:none}
.pwheel .grip{position:absolute;left:4px;right:4px;height:18px;border-radius:8px;top:51px;
  background:linear-gradient(180deg,#eafdff,var(--neon));box-shadow:0 0 12px var(--neon)}
.pwheel .mid{position:absolute;left:0;right:0;top:50%;height:1px;background:var(--neon2);opacity:.5}

/* help & shortcut tables */
.kbd{font-family:'Share Tech Mono',monospace;font-size:11px;background:rgba(0,240,255,.1);
  border:1px solid var(--line);border-radius:5px;padding:2px 7px;color:var(--neon);display:inline-block;min-width:22px;text-align:center}
.sc-row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid rgba(0,240,255,.08);font-size:12px}
.sc-row span:last-child{color:var(--muted);text-align:right}
.help-h{font-family:'Orbitron',sans-serif;font-size:12px;color:var(--neon2);letter-spacing:1px;margin:14px 0 6px;text-transform:uppercase}
.help-p{font-size:13px;line-height:1.55;color:var(--text);margin-bottom:6px}

/* swatches */
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.swatch{width:30px;height:30px;border-radius:7px;border:2px solid transparent;cursor:pointer;box-shadow:0 0 8px rgba(0,0,0,.5)}
.swatch.on{border-color:#fff}
.colorpick{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.colorpick input[type=color]{width:42px;height:30px;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer}

/* toast */
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);z-index:999;
  background:rgba(0,240,255,.12);border:1px solid var(--neon);border-radius:8px;padding:10px 18px;
  font-family:'Share Tech Mono',monospace;font-size:13px;color:var(--neon);opacity:0;transition:.3s;
  box-shadow:0 0 20px rgba(0,240,255,.4);pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* small utility */
.divider{height:1px;background:var(--line);margin:12px 0}
.pillbtns{display:flex;gap:6px;flex-wrap:wrap}
.mini-num{width:54px}
.flexcol{display:flex;flex-direction:column;gap:8px}
.tag-on{color:var(--neon3)}
.tag-off{color:#557}
/* ===== MOTION (camera) WINDOW ===== */
.mo-stage{position:relative;width:100%;height:210px;background:#000;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:8px;flex:none}
.mo-stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#moVideo{position:absolute;left:-20px;top:-20px;width:2px;height:2px;opacity:0;pointer-events:none}
.mo-status{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--neon);min-height:15px;margin:0 0 6px;opacity:.9}
.mo-badges{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 8px}
.mo-badge{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:.5px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;color:var(--muted);cursor:pointer;text-transform:uppercase;user-select:none}
.mo-badge.on{color:#021;font-weight:600;border-color:transparent}
.mo-badge.head.on{background:var(--neon);box-shadow:0 0 10px var(--neon)}
.mo-badge.arms.on{background:#ff2bd6;box-shadow:0 0 10px #ff2bd6}
.mo-badge.hands.on{background:#b6ff3a;box-shadow:0 0 10px #b6ff3a}
.mo-badge.legs.on{background:#9b6bff;box-shadow:0 0 10px #9b6bff}
.mo-badge.body.on{background:#27e0c3;box-shadow:0 0 10px #27e0c3}
.mo-zoom{display:flex;align-items:center;gap:8px;margin:4px 0}
.mo-zoom input{flex:1}
#viewCtl{position:absolute;top:calc(6px + env(safe-area-inset-top,0));right:calc(8px + env(safe-area-inset-right,0));z-index:60;display:flex;gap:5px}
.vc{font-family:'Orbitron',sans-serif;font-size:9px;letter-spacing:.5px;text-transform:uppercase;
  padding:5px 9px;border:1px solid var(--line);border-radius:7px;background:rgba(4,8,14,.85);color:var(--muted);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.vc.on{color:#021;background:var(--neon);box-shadow:0 0 10px var(--neon)}
.vc:active{transform:scale(.94)}
.resz-h{position:relative;z-index:45;height:14px;flex:none;cursor:ns-resize;touch-action:none;
  display:flex;align-items:center;justify-content:center;background:rgba(4,8,14,.5)}
.resz-h::before{content:"";width:46px;height:4px;border-radius:3px;
  background:var(--neon);opacity:.55;box-shadow:0 0 10px var(--neon)}
.resz-h:hover::before{opacity:.9}
.resz-h.top{border-top:1px solid var(--line)}
.reveal-tab{position:absolute;left:50%;transform:translateX(-50%);z-index:55;display:none;
  font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:1px;text-transform:uppercase;
  padding:5px 16px;border:1px solid var(--neon);color:var(--neon);cursor:pointer;
  background:rgba(4,8,14,.9);box-shadow:0 0 14px rgba(0,240,255,.4);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.reveal-tab.top{top:0;border-radius:0 0 10px 10px}
.reveal-tab.bottom{bottom:0;border-radius:10px 10px 0 0}
.reveal-tab:active{background:var(--neon);color:#021}
#app.top-hidden .reveal-tab.top{display:block}
#app.piano-hidden .reveal-tab.bottom{display:block}
#app.stage #topRegion,#app.stage #topResize{display:none}
#app.stage #pianoDock,#app.stage #kbResize{display:none}
#app.stage #desktop{background:radial-gradient(circle at 50% 40%,rgba(0,240,255,.05),transparent 70%)}

/* ===== CAMERA ===== */
.cam-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;
  opacity:0;pointer-events:none;transition:opacity .4s ease;transform:scaleX(-1);
  filter:saturate(1.15) contrast(1.05)}
.cam-bg.on{opacity:.32}
.cam-stage{position:relative;width:100%;height:150px;border:1px solid var(--line);border-radius:8px;overflow:hidden;
  background:#04070c;display:flex;align-items:center;justify-content:center}
.cam-stage video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam-stage .ph{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--muted);text-align:center;padding:10px}
.cam-dot{position:absolute;width:18px;height:18px;border-radius:50%;transform:translate(-50%,-50%);
  background:var(--neon2);box-shadow:0 0 14px var(--neon2);pointer-events:none;transition:opacity .15s}
.cam-read{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--neon);opacity:.85;margin-top:6px}
.cam-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:8px}

/* ===== RESPONSIVE (phones & tablets) ===== */
@media(max-width:900px){
  .win{max-width:96vw}
}
@media(max-width:640px){
  .logo{font-size:clamp(54px,18vw,90px)}
  .tb-group{padding:4px 7px;gap:6px}
  .hslider{width:84px}
  #topbar{gap:7px;padding:7px 8px;padding-right:124px}
  .brandmini{font-size:20px}
  #dock{gap:6px;padding:6px 8px;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}
  #dock .btn{flex:none;font-size:11px;padding:7px 9px}
  .piano-tools{gap:6px;padding:6px 8px;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}
  .piano-tools .tb-group{flex:none}
  .btn{padding:8px 10px;font-size:12px}
  .btn.sm{padding:7px 9px}
  .win{min-width:0}
  .knob .dial{width:50px;height:50px}
  .pwheel{width:46px}
  #viewCtl{top:5px;right:6px}
  .vc{padding:6px 8px}
}
@media(max-width:640px) and (orientation:portrait){
  .kb-wrap{--kb-h:120px}
}
/* larger touch targets on coarse pointers (touch devices) */
@media(pointer:coarse){
  .btn,.vc,.seg button{min-height:38px}
  .resz-h{height:20px}
  .knob .dial{cursor:ns-resize}
  select,.txtin{padding:9px 10px;font-size:14px}
  .win-dot{width:26px;height:26px}
}
@media(max-width:480px){
  .win{width:94vw!important;left:3vw!important}
}

<script>
"use strict";
/* ============================================================
   HID LAB — engine
   ============================================================ */
const AC = window.AudioContext || window.webkitAudioContext;
let ctx=null;
const E={}; // engine nodes

function buildEngine(){
  ctx = new AC();
  // ---- master output chain ----
  E.limiter = ctx.createDynamicsCompressor();
  E.limiter.threshold.value=-2; E.limiter.knee.value=2; E.limiter.ratio.value=20;
  E.limiter.attack.value=0.002; E.limiter.release.value=0.18;
  E.master = ctx.createGain(); E.master.gain.value=0.8;
  E.limiter.connect(ctx.destination);

  // ---- enhancer (bigger/deeper enhancement, bypassable) ----
  E.enhIn = ctx.createGain();
  E.enhLow = ctx.createBiquadFilter(); E.enhLow.type='lowshelf'; E.enhLow.frequency.value=140; E.enhLow.gain.value=0;
  E.enhShape = ctx.createWaveShaper(); E.enhShape.curve = makeSatCurve(0); E.enhShape.oversample='4x';
  E.enhMakeup = ctx.createGain(); E.enhMakeup.gain.value=1;
  E.enhLow.connect(E.enhShape); E.enhShape.connect(E.enhMakeup); E.enhMakeup.connect(E.master);
  E.enhBypass = ctx.createGain();
  E.enhBypass.connect(E.master);
  E.enhIn.connect(E.enhBypass); // default bypassed
  E.master.connect(E.limiter);
  E.enhancerOn=false;

  // ---- mix bus + global EQ ----
  E.mix = ctx.createGain();
  E.gEQ = makeEQ(); // 3 band
  E.mix.connect(E.gEQ.input);
  E.gEQ.output.connect(E.enhIn);

  // ---- global delay (BPM synced) ----
  E.delayIn = ctx.createGain();
  E.delay = ctx.createDelay(2.5);
  E.delayFb = ctx.createGain(); E.delayFb.gain.value=0.35;
  E.delayOut = ctx.createGain(); E.delayOut.gain.value=0.9;
  E.delayTone = ctx.createBiquadFilter(); E.delayTone.type='lowpass'; E.delayTone.frequency.value=4500;
  E.delayIn.connect(E.delay); E.delay.connect(E.delayTone); E.delayTone.connect(E.delayFb);
  E.delayFb.connect(E.delay); E.delayTone.connect(E.delayOut); E.delayOut.connect(E.mix);

  // ---- live piano bus ----
  E.pianoBus = ctx.createGain();
  E.pianoEQ = makeEQ();
  E.pianoLevel = ctx.createGain(); E.pianoLevel.gain.value=1;
  E.pianoDelaySend = ctx.createGain(); E.pianoDelaySend.gain.value=0;
  E.pianoBus.connect(E.pianoEQ.input);
  E.pianoEQ.output.connect(E.pianoLevel); E.pianoLevel.connect(E.mix);
  E.pianoEQ.output.connect(E.pianoDelaySend); E.pianoDelaySend.connect(E.delayIn);

  // ---- 3D space reverb ----
  E.spaceConv = ctx.createConvolver();
  E.spaceConv.buffer = makeImpulse(4.2,3.2,true);
  E.spaceWet = ctx.createGain(); E.spaceWet.gain.value=0;
  E.spaceSend = ctx.createGain(); E.spaceSend.gain.value=0; // from mix
  E.spaceHi = ctx.createBiquadFilter(); E.spaceHi.type='highpass'; E.spaceHi.frequency.value=320;
  E.spaceSend.connect(E.spaceConv); E.spaceConv.connect(E.spaceHi); E.spaceHi.connect(E.spaceWet); E.spaceWet.connect(E.master);
  E.mix.connect(E.spaceSend);
  E.spacePoints = ctx.createGain(); E.spacePoints.gain.value=1; E.spacePoints.connect(E.master);
  E.spacePointsRev = ctx.createGain(); E.spacePointsRev.gain.value=0.6; E.spacePointsRev.connect(E.spaceConv);

  // ---- analyser for scopes ----
  E.analyser = ctx.createAnalyser(); E.analyser.fftSize=2048;
  E.master.connect(E.analyser);

  // live synth params (editable in Sound Design)
  E.live = JSON.parse(JSON.stringify(currentPreset()));
}

function makeEQ(){
  const input=ctx.createGain(), output=ctx.createGain();
  const low=ctx.createBiquadFilter(); low.type='lowshelf'; low.frequency.value=160; low.gain.value=0;
  const mid=ctx.createBiquadFilter(); mid.type='peaking'; mid.frequency.value=1000; mid.Q.value=1; mid.gain.value=0;
  const high=ctx.createBiquadFilter(); high.type='highshelf'; high.frequency.value=4500; high.gain.value=0;
  input.connect(low); low.connect(mid); mid.connect(high); high.connect(output);
  return {input,output,low,mid,high};
}
function makeSatCurve(amount){
  const n=1024, c=new Float32Array(n), k=amount*60;
  for(let i=0;i<n;i++){const x=i/(n-1)*2-1; c[i]= (1+k)*x/(1+k*Math.abs(x));}
  return c;
}
function makeImpulse(dur,decay,bright){
  const rate=ctx.sampleRate, len=rate*dur, buf=ctx.createBuffer(2,len,rate);
  for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);
    for(let i=0;i<len;i++){const t=i/len;
      let s=(Math.random()*2-1)*Math.pow(1-t,decay);
      if(bright){ s*=(0.6+0.4*Math.sin(t*40+ch)); s+= (Math.random()*2-1)*Math.pow(1-t,decay*1.6)*0.35; }
      d[i]=s; } }
  return buf;
}

/* ============================================================
   SOUND BANKS — 5 banks x 20 presets (synthesized, no duplicates)
   ============================================================ */
function P(name,o){return Object.assign({
  name, osc:[{type:'sawtooth',semis:0,detune:0,level:1}], unison:{voices:1,spread:0},
  fm:{ratio:0,index:0,decay:0.3}, noise:0,
  filter:{type:'lowpass',cutoff:1800,q:0.7,envAmt:0,envDecay:0.4,keytrack:0.2},
  amp:{a:0.006,d:0.4,s:0.8,r:0.4}, lfo:{target:'none',rate:5,depth:0}, gain:0.8, pan:0
},o);}

const BANKS = {
"Synth Bass":[
 P("Reese",{osc:[{type:'sawtooth',semis:0,detune:-14,level:.9},{type:'sawtooth',semis:0,detune:14,level:.9}],filter:{type:'lowpass',cutoff:520,q:6,envAmt:300,envDecay:.5,keytrack:.1},amp:{a:.004,d:.3,s:.85,r:.3},gain:.95}),
 P("808 Sub",{osc:[{type:'sine',semis:0,detune:0,level:1}],filter:{type:'lowpass',cutoff:240,q:.5,envAmt:0,envDecay:.3},amp:{a:.004,d:1.4,s:.0,r:.6},gain:1}),
 P("Moog Mk1",{osc:[{type:'sawtooth',semis:0,detune:0,level:1}],filter:{type:'lowpass',cutoff:640,q:8,envAmt:700,envDecay:.35},amp:{a:.004,d:.25,s:.7,r:.25},gain:.9}),
 P("Acid 303",{osc:[{type:'sawtooth',semis:0,detune:0,level:1}],filter:{type:'lowpass',cutoff:420,q:14,envAmt:1400,envDecay:.18},amp:{a:.003,d:.18,s:.4,r:.12},gain:.85}),

function whiteNoiseBuffer(){
  if(E._noise) return E._noise;
  const b=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate); const d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  E._noise=b; return b;
}

function makeVoice(midi, params, target, opts={}){
  const now=ctx.currentTime;
  const vel = opts.velocity!=null?opts.velocity:0.9;
  const glide = opts.glide||0;
  const freq = midiToFreq(midi);
  const startFreq = (opts.fromMidi!=null)? midiToFreq(opts.fromMidi) : freq;

  const pre=ctx.createGain(); pre.gain.value=1;
  const filter=ctx.createBiquadFilter();
  filter.type=params.filter.type||'lowpass';
  filter.Q.value=params.filter.q||0.7;
  const amp=ctx.createGain(); amp.gain.value=0;
  filter.connect(amp); amp.connect(target);

  const oscs=[]; // {node, baseDetune}
  let modOsc=null,modGain=null;

  // unison expansion
  function spreadList(base){
    const v=params.unison&&params.unison.voices>1?params.unison.voices:1;
    const sp=params.unison?params.unison.spread:0;
    const arr=[];
    for(let i=0;i<v;i++){
      const off = v>1? (i/(v-1)-0.5)*2*sp : 0;
      arr.push(base+off);
    }
    return arr;
  }

  params.osc.forEach(o=>{
    spreadList(o.detune||0).forEach(det=>{
      const osc=ctx.createOscillator();
      osc.type=o.type;
      const f0=startFreq*Math.pow(2,(o.semis||0)/12);
      const f1=freq*Math.pow(2,(o.semis||0)/12);
      osc.frequency.setValueAtTime(f0,now);
      if(glide>0 && opts.fromMidi!=null) osc.frequency.linearRampToValueAtTime(f1,now+glide);
      else osc.frequency.setValueAtTime(f1,now);
      osc.detune.value=det;
      const g=ctx.createGain(); g.gain.value=(o.level||1)/Math.sqrt((params.unison&&params.unison.voices>1)?params.unison.voices:1);
      osc.connect(g); g.connect(pre);
      osc.start(now);
      oscs.push({node:osc,baseDetune:det});
    });
  });

  // FM
  if(params.fm && params.fm.index>0){
    modOsc=ctx.createOscillator(); modOsc.type='sine';
    modOsc.frequency.setValueAtTime(freq*params.fm.ratio,now);
    modGain=ctx.createGain();
    modGain.gain.setValueAtTime(params.fm.index*vel,now);
    modGain.gain.exponentialRampToValueAtTime(Math.max(1,params.fm.index*0.05),now+params.fm.decay);
    modOsc.connect(modGain);
    oscs.forEach(o=> modGain.connect(o.node.frequency));
    modOsc.start(now);
  }

  // noise
  let noiseSrc=null;
  if(params.noise>0){
    noiseSrc=ctx.createBufferSource(); noiseSrc.buffer=whiteNoiseBuffer(); noiseSrc.loop=true;
    const ng=ctx.createGain(); ng.gain.value=params.noise;
    noiseSrc.connect(ng); ng.connect(pre); noiseSrc.start(now);
  }
  pre.connect(filter);

  // filter envelope
  const kt = 1 + (params.filter.keytrack||0)*((midi-60)/24);
  const base = Math.max(60,(params.filter.cutoff||1800)*kt);
  const peak = Math.min(18000, base + (params.filter.envAmt||0));
  filter.frequency.setValueAtTime(peak,now);
  if((params.filter.envAmt||0)>0)
    filter.frequency.exponentialRampToValueAtTime(Math.max(60,base),now+(params.filter.envDecay||0.4));
  else filter.frequency.setValueAtTime(base,now);

  // amp ADSR
  const peakLevel=(params.gain||0.8)*vel;
  const a=Math.max(0.002,params.amp.a), d=Math.max(0.01,params.amp.d), s=params.amp.s;
  amp.gain.setValueAtTime(0.0001,now);
  amp.gain.linearRampToValueAtTime(peakLevel,now+a);
  amp.gain.setTargetAtTime(Math.max(0.0001,peakLevel*s),now+a,d/3);

  // LFO
  let lfoOsc=null;
  if(params.lfo && params.lfo.target!=='none' && params.lfo.depth>0){
    lfoOsc=ctx.createOscillator(); lfoOsc.frequency.value=params.lfo.rate; lfoOsc.type='sine';
    const lg=ctx.createGain(); lg.gain.value=params.lfo.depth; lfoOsc.connect(lg);
    if(params.lfo.target==='pitch') oscs.forEach(o=>lg.connect(o.node.detune));
    else if(params.lfo.target==='amp'){ const lg2=ctx.createGain(); lg2.gain.value=params.lfo.depth; lfoOsc.connect(lg2); lg2.connect(amp.gain); }
    else if(params.lfo.target==='filter') lg.connect(filter.frequency);
    lfoOsc.start(now);
  }

  const voice={
    midi, oscs, amp, filter, releaseT:params.amp.r||0.4,
    bendEnabled: opts.bendEnabled!==false,
    glideable: params.glideable||false,
    setBend(cents,gt){
      if(!this.bendEnabled) return;
      const t=ctx.currentTime;
      this.oscs.forEach(o=>{
        o.node.detune.cancelScheduledValues(t);
        o.node.detune.linearRampToValueAtTime(o.baseDetune+cents, t+Math.max(0.001,gt||0));
      });
    },
    glideTo(m,gt){
      const t=ctx.currentTime; this.midi=m;
      params.osc.forEach((o,idx)=>{}); // base
      this.oscs.forEach((o)=>{
        const semis = 0; // detune handled separately
      });
      // re-set frequency of each oscillator
      let i=0;
      params.osc.forEach(o=>{
        const cnt=(params.unison&&params.unison.voices>1)?params.unison.voices:1;
        for(let k=0;k<cnt;k++){
          const node=this.oscs[i].node; i++;
          const nf=midiToFreq(m)*Math.pow(2,(o.semis||0)/12);
          node.frequency.cancelScheduledValues(t);
          node.frequency.linearRampToValueAtTime(nf,t+Math.max(0.005,gt||0.05));
        }
      });
    },
    stop(rel){
      const t=ctx.currentTime; const r=rel!=null?rel:this.releaseT;
      this.amp.gain.cancelScheduledValues(t);
      const cur=this.amp.gain.value;
      this.amp.gain.setValueAtTime(Math.max(0.0001,cur),t);
      this.amp.gain.linearRampToValueAtTime(0.0001,t+r);
      const stopAt=t+r+0.05;
      this.oscs.forEach(o=>{try{o.node.stop(stopAt)}catch(e){}});
      if(modOsc)try{modOsc.stop(stopAt)}catch(e){}
      if(noiseSrc)try{noiseSrc.stop(stopAt)}catch(e){}
      if(lfoOsc)try{lfoOsc.stop(stopAt)}catch(e){}
    }
  };
  return voice;
}

/* ============================================================
   VOICE MANAGER (live piano)
   ============================================================ */
const VM={
  voices:new Map(), held:new Set(), sustainOn:false, sustained:new Set(),
  playMode:'poly', // poly | mono | legato
  monoStack:[], monoVoice:null,
  bendCents:0, glideTime:0.06,
  pianoEnabled:true,

  liveParams(){ return E.live; },

  noteOn(midi,vel){
    if(!this.pianoEnabled) return;
    ensureCtx();
    this.held.add(midi);
    if(this.playMode==='poly'){
      if(this.voices.has(midi)) this.voices.get(midi).stop(0.02);
      const v=makeVoice(midi,this.liveParams(),E.pianoBus,{velocity:vel,bendEnabled:true});
      v.setBend(this.bendCents,0);
      this.voices.set(midi,v);
    } else {
      // mono / legato
      this.monoStack.push(midi);
      if(this.monoVoice && this.playMode==='legato'){
        this.monoVoice.glideTo(midi,this.glideTime);
      } else {
        if(this.monoVoice) this.monoVoice.stop(0.03);
        const v=makeVoice(midi,this.liveParams(),E.pianoBus,{velocity:vel,bendEnabled:true,
          glide:this.glideTime, fromMidi:(this.monoVoice?this.monoVoice.midi:null)});
        v.setBend(this.bendCents,0);
        this.monoVoice=v;
      }
    }
    paintKey(midi,true);
  },
  noteOff(midi){
    this.held.delete(midi);
    if(this.playMode==='poly'){
      if(this.sustainOn){ this.sustained.add(midi); }
      else { const v=this.voices.get(midi); if(v){v.stop(); this.voices.delete(midi);} }
    } else {
      const idx=this.monoStack.lastIndexOf(midi);
      if(idx>=0) this.monoStack.splice(idx,1);
      if(this.monoStack.length===0){
        if(this.sustainOn){ /* hold */ }
        else if(this.monoVoice){ this.monoVoice.stop(); this.monoVoice=null; }
      } else {
        const prev=this.monoStack[this.monoStack.length-1];
        if(this.monoVoice){ if(this.playMode==='legato') this.monoVoice.glideTo(prev,this.glideTime); else { this.monoVoice.stop(0.02); const v=makeVoice(prev,this.liveParams(),E.pianoBus,{velocity:0.9,bendEnabled:true}); v.setBend(this.bendCents,0); this.monoVoice=v; } }
      }
    }
    paintKey(midi,false);
  },
  setSustain(on){
    this.sustainOn=on;
    if(!on){
      this.sustained.forEach(m=>{ const v=this.voices.get(m); if(v){v.stop(); this.voices.delete(m);} });
      this.sustained.clear();
      if(this.playMode!=='poly' && this.monoStack.length===0 && this.monoVoice){ this.monoVoice.stop(); this.monoVoice=null; }
    }
  },
  applyBend(cents,gt){
    this.bendCents=cents;
    this.voices.forEach(v=>v.setBend(cents,gt));
    if(this.monoVoice) this.monoVoice.setBend(cents,gt);
    Pads.applyBend(cents,gt);
  },
  // live filter sweep (used by the Camera motion controller) — affects currently sounding voices
  setLiveCutoff(freq){
    const t=ctx?ctx.currentTime:0; const f=Math.max(60,Math.min(18000,freq));
    const ramp=v=>{ if(v&&v.filter){ try{ v.filter.frequency.cancelScheduledValues(t); v.filter.frequency.linearRampToValueAtTime(f,t+0.03); }catch(e){} } };
    this.voices.forEach(ramp);
    if(this.monoVoice) ramp(this.monoVoice);
  },
  killAll(){
    this.voices.forEach(v=>v.stop(0.02)); this.voices.clear();
    if(this.monoVoice){this.monoVoice.stop(0.02);this.monoVoice=null;}
    this.monoStack=[]; this.held.clear(); this.sustained.clear();
    document.querySelectorAll('.wkey.down,.bkey.down,.cbar.down').forEach(el=>el.classList.remove('down'));
  }
};

/* ============================================================

   ============================================================ */
const WinMgr={
  z:100, open:new Map(), cascade:0,
  registry:{}, // type -> {title, w, h, build}

  toggle(type){
    if(this.open.has(type)){ this.close(type); }
    else this.openWin(type);
  },
  openWin(type){
    if(this.open.has(type)){ this.focus(this.open.get(type)); return this.open.get(type); }
    const def=this.registry[type]; if(!def) return;
    const win=document.createElement('div'); win.className='win'; win.dataset.type=type;
    const w=def.w||320,h=def.h||280;
    const dx=(this.cascade%6)*30, dy=(this.cascade%6)*30; this.cascade++;
    win.style.width=w+'px'; win.style.height=h+'px';
    win.style.left=Math.min(window.innerWidth-w-20, 60+dx)+'px';
    win.style.top=(80+dy)+'px';
    win.innerHTML=`<div class="win-bar"><span class="win-title">${def.title}</span>
      <button class="win-dot min" title="Minimize">_</button>
      <button class="win-dot close" title="Close">×</button></div>
      <div class="win-body"></div><div class="win-resize"></div>`;
    document.getElementById('desktop').appendChild(win);
    this.open.set(type,win);
    def.build(win.querySelector('.win-body'), win);
    this.wire(win,type);
    this.focus(win);
    markDock(type,true);
    return win;
  },
  close(type){
    const win=this.open.get(type); if(!win) return;
    win.remove(); this.open.delete(type); markDock(type,false);
  },
  focus(win){ win.style.zIndex=++this.z;
    document.querySelectorAll('.win.focused').forEach(w=>w.classList.remove('focused'));
    win.classList.add('focused'); },
  wire(win,type){
    const bar=win.querySelector('.win-bar');
    win.addEventListener('pointerdown',()=>this.focus(win),true);
    win.querySelector('.close').addEventListener('click',e=>{e.stopPropagation();this.close(type);});
    win.querySelector('.min').addEventListener('click',e=>{e.stopPropagation();win.classList.toggle('min');});
    // drag
    let dragging=false,sx,sy,ox,oy;
    bar.addEventListener('pointerdown',e=>{
      if(e.target.classList.contains('win-dot'))return;
      dragging=true; sx=e.clientX; sy=e.clientY;
      ox=parseFloat(win.style.left); oy=parseFloat(win.style.top);
      bar.setPointerCapture(e.pointerId); this.focus(win);
    });
    bar.addEventListener('pointermove',e=>{ if(!dragging)return;
      let nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
      nx=Math.max(-win.offsetWidth+80,Math.min(window.innerWidth-40,nx));
      ny=Math.max(40,Math.min(window.innerHeight-40,ny));
      win.style.left=nx+'px'; win.style.top=ny+'px';
    });
    bar.addEventListener('pointerup',e=>{dragging=false;});
    // resize
    const rz=win.querySelector('.win-resize');
    let rs=false,rsx,rsy,rw,rh;
    rz.addEventListener('pointerdown',e=>{e.stopPropagation();rs=true;rsx=e.clientX;rsy=e.clientY;
      rw=win.offsetWidth;rh=win.offsetHeight;rz.setPointerCapture(e.pointerId);});
    rz.addEventListener('pointermove',e=>{if(!rs)return;
      win.style.width=Math.max(220,rw+(e.clientX-rsx))+'px';
      win.style.height=Math.max(130,rh+(e.clientY-rsy))+'px';});
    rz.addEventListener('pointerup',()=>rs=false);
  }
};
function markDock(type,on){
  const b=document.querySelector(`#dock .btn[data-win="${type}"]`);
  if(b) b.classList.toggle('active',on);
}

   KNOB & SLIDER HELPERS
   ============================================================ */
function makeKnob(label, min, max, val, fmt, onChange){
  const wrap=document.createElement('div'); wrap.className='knob';
  const dial=document.createElement('div'); dial.className='dial';
  const num=document.createElement('div'); num.className='num';
  const lbl=document.createElement('div'); lbl.className='lbl'; lbl.textContent=label;
  wrap.appendChild(dial); wrap.appendChild(lbl); wrap.appendChild(num);
  let v=val;
  function render(){
    const ratio=(v-min)/(max-min);
    dial.style.setProperty('--rot',(ratio*270-135)+'deg');
    num.textContent= fmt?fmt(v):(Math.round(v*100)/100);
  }
  render();
  let dragging=false,sy,sv;
  dial.addEventListener('pointerdown',e=>{dragging=true;sy=e.clientY;sv=v;dial.setPointerCapture(e.pointerId);});
  dial.addEventListener('pointermove',e=>{if(!dragging)return;
    const dy=sy-e.clientY; const range=max-min;
    v=Math.max(min,Math.min(max, sv+ dy/180*range));
    render(); onChange(v);});
  dial.addEventListener('pointerup',()=>dragging=false);
  dial.addEventListener('dblclick',()=>{v=val;render();onChange(v);});
  wrap._set=(nv)=>{v=nv;render();};
  return wrap;
}

function isBlack(m){ return BLACK.includes(((m%12)+12)%12); }

function renderKeyboard(){

  let m=KB.startMidi; while(isBlack(m)) m++;
  const whites=[]; let cur=m;
  while(whites.length<KB.whiteCount){ if(!isBlack(cur)) whites.push(cur); cur++; }
  const lastMidi=cur;
  const gap=1;
  whites.forEach((wm,i)=>{
    const k=document.createElement('div'); k.className='wkey'; k.dataset.midi=wm;
    k.style.width=KB.keyW+'px';
    const snd=sounding(wm);
    if(((snd%12)+12)%12===0){ const l=document.createElement('div'); l.className='kl'; l.textContent=midiName(snd); k.appendChild(l); }
    kb.appendChild(k);
  });
  // black keys absolutely
  for(let bm=KB.startMidi; bm<lastMidi; bm++){
    if(!isBlack(bm)) continue;
    // find index of preceding white
    let pw=bm-1; while(isBlack(pw)) pw--;
    const idx=whites.indexOf(pw); if(idx<0) continue;
    const b=document.createElement('div'); b.className='bkey'; b.dataset.midi=bm;
    const bw=KB.keyW*0.62;
    b.style.width=bw+'px';
    b.style.left=(idx*(KB.keyW+gap)+KB.keyW-bw/2)+'px';
    kb.appendChild(b);
  }
}

function renderChroma(){
  const kb=document.getElementById('keyboard');
  kb.className='chroma';
  kb.innerHTML='';
  const intervals=SCALES[KB.scale]||SCALES['Chromatic'];
  const barCount = KB.scale==='Chromatic'? KB.whiteCount+8 : Math.max(8, Math.round(KB.whiteCount*intervals.length/7));
  // build ascending notes that belong to scale starting from root
  const notes=[]; let m=KB.startMidi;
  // shift start to root
  while(((m - KB.root)%12+12)%12 !==0 && KB.scale!=='Chromatic') m++;
  let guard=0;
  while(notes.length<barCount && guard<400){
    const pc=((m-KB.root)%12+12)%12;
    if(KB.scale==='Chromatic' || intervals.includes(pc)) notes.push(m);
    m++; guard++;
  }
  notes.forEach(nm=>{
    const bar=document.createElement('div'); bar.className='cbar'; bar.dataset.midi=nm;
    const snd=sounding(nm);
    if(((snd-KB.root)%12+12)%12===0) bar.classList.add('root');
    bar.style.width=Math.max(40,KB.keyW+10)+'px';
    bar.innerHTML=`<span class="cl">${midiName(snd)}</span>`;
    kb.appendChild(bar);
  });
}

/* input — pointer (with glissando) */
let kbPressed=false; let lastGlissMidi=null;
function bindKeyboardInput(){
  const kb=document.getElementById('keyboard');
  function midiFromEl(el){ const k=el.closest('[data-midi]'); return k?parseInt(k.dataset.midi):null; }
  kb.addEventListener('pointerdown',e=>{ const m=midiFromEl(e.target); if(m==null)return;
    kbPressed=true; lastGlissMidi=m; pressVisual(m,sounding(m));
    try{kb.setPointerCapture(e.pointerId);}catch(_){}
  });
  kb.addEventListener('pointermove',e=>{ if(!kbPressed)return;
    const el=document.elementFromPoint(e.clientX,e.clientY); if(!el)return;
    const k=el.closest('[data-midi]'); if(!k)return; const m=parseInt(k.dataset.midi);
    if(m!==lastGlissMidi){
      if(VM.playMode==='poly'){ releaseVisual(lastGlissMidi,sounding(lastGlissMidi)); pressVisual(m,sounding(m)); }
      else { // mono/legato glide: release old logical, press new
        releaseVisual(lastGlissMidi,sounding(lastGlissMidi)); pressVisual(m,sounding(m));
      }
      lastGlissMidi=m;
    }
  });
  function up(){ if(!kbPressed)return; kbPressed=false; if(lastGlissMidi!=null){ releaseVisual(lastGlissMidi,sounding(lastGlissMidi)); lastGlissMidi=null; } }
  kb.addEventListener('pointerup',up);
  kb.addEventListener('pointercancel',up);
  kb.addEventListener('pointerleave',up);
}

function pressVisual(visualMidi, soundMidi){
  if(buildMode.active){ buildMode.toggleNote(soundMidi); return; }
  VM.noteOn(soundMidi,0.9);
  paintKeyVisual(visualMidi,true);
}
function releaseVisual(visualMidi, soundMidi){
  if(buildMode.active){ return; }
  VM.noteOff(soundMidi);
  paintKeyVisual(visualMidi,false);
}
// paint by sounding midi (used by VM/computer kbd) -> find element with matching visual
function paintKey(soundMidi,on){
  // reverse-map sounding to visual
  const vm=soundMidi-(KB.octave*12+KB.transpose);
  paintKeyVisual(vm,on);
}
function paintKeyVisual(visualMidi,on,cls){
  const el=document.querySelector(`#keyboard [data-midi="${visualMidi}"]`);
  if(!el)return;
  if(cls){ el.classList.toggle(cls,on); }
  else { el.classList.toggle('down',on); }
}

const PAD_KEYS=['1','2','3','4','5','6','7','8','9','0','-','='];
const Pads={
  list:[], playMode:'toggle', selected:null, cols:4, idc:0, cursor:-1,

  newPad(extra={}){
    const id='p'+(this.idc++);
    const pad=Object.assign({
      id, name:'Empty', type:'empty', notes:[], snapshot:null,
      buffer:null, bufName:'', transpose:0, bendEnabled:true, gain:0.9,
      media:null, mediaSrc:null, fileB64:null, mime:'',
      key:PAD_KEYS[this.list.length]||'', bus:null, eq:null, delaySend:null,
      voices:[], source:null, playing:false
    },extra);
    this._buildAudio(pad);
    this.list.push(pad);
    return pad;
  },
  _buildAudio(pad){
    if(!ctx) return;
    pad.bus=ctx.createGain(); pad.bus.gain.value=pad.gain;
    pad.eq=makeEQ();
    pad.level=ctx.createGain(); pad.level.gain.value=1;
    pad.delaySend=ctx.createGain(); pad.delaySend.gain.value=0;
    pad.bus.connect(pad.eq.input);
    pad.eq.output.connect(pad.level); pad.level.connect(E.mix);
    pad.eq.output.connect(pad.delaySend); pad.delaySend.connect(E.delayIn);
  },
  ensureAudio(){ this.list.forEach(p=>{ if(!p.bus) this._buildAudio(p); }); },

  init(){
    for(let i=0;i<8;i++) this.newPad();
    this.selected=this.list[0].id;
  },

  trigger(id){
    ensureCtx(); this.ensureAudio();
    const pad=this.byId(id); if(!pad||pad.type==='empty')return;
    if(this.playMode==='solo'){
      this.list.forEach(p=>{ if(p!==pad&&p.playing) this._stop(p); });
      this._stop(pad); this._start(pad);
    } else { // toggle & stack both toggle independently
      if(pad.playing) this._stop(pad); else this._start(pad);
    }
  },
  // step through saved (non-empty) pads with wraparound — used by ◄/► keys
  cycle(dir){
    ensureCtx(); this.ensureAudio();
    const saved=this.list.filter(p=>p.type!=='empty');
    if(!saved.length){ toast('No saved pads to cycle'); return; }
    this.cursor=((this.cursor+dir)%saved.length + saved.length)%saved.length;
    const pad=saved[this.cursor];
    this.selected=pad.id;
    this.trigger(pad.id);
    this.render();
    toast('Pad '+(pad.key||(this.cursor+1))+' · '+pad.name);
  },
  _start(pad){
    pad.playing=true;
    if(pad.type==='audio'&&pad.buffer){
      const s=ctx.createBufferSource(); s.buffer=pad.buffer; s.loop=!!pad.loop;
      try{ s.playbackRate.value=Math.pow(2,(pad.transpose||0)/12); }catch(e){}
      if(pad.bendEnabled){ try{ s.detune.value=VM.bendCents; }catch(e){} }
      s.connect(pad.bus);
      s.onended=()=>{ if(pad.source===s){ pad.playing=false; pad.source=null; this._paint(pad); } };
      s.start(); pad.source=s;
    } else if(pad.type==='media'&&pad.media){
      try{ pad.media.playbackRate=Math.pow(2,(pad.transpose||0)/12); }catch(e){}
      pad.media.loop=!!pad.loop;
      try{ pad.media.currentTime=0; }catch(e){}
      const pr=pad.media.play(); if(pr&&pr.catch)pr.catch(()=>{});
    } else if(pad.type==='notes'){
      const params=pad.snapshot||E.live;
      pad.voices=pad.notes.map(n=>{
        const m=n+pad.transpose;
        const v=makeVoice(m,params,pad.bus,{velocity:0.9,bendEnabled:pad.bendEnabled});
        if(pad.bendEnabled) v.setBend(VM.bendCents,0);
        return v;
      });
    }
    this._paint(pad);
  },
  _stop(pad){
    pad.playing=false;
    if(pad.source){ try{pad.source.onended=null; pad.source.stop();}catch(e){} pad.source=null; }
    if(pad.media){ try{pad.media.pause();}catch(e){} }
    pad.voices.forEach(v=>v.stop()); pad.voices=[];
    this._paint(pad);
  },
  applyBend(cents,gt){
    this.list.forEach(p=>{ if(!p.bendEnabled)return;
      p.voices.forEach(v=>v.setBend(cents,gt));
      if(p.source){ try{p.source.detune.linearRampToValueAtTime(cents, ctx.currentTime+(gt||0.001));}catch(e){} }
    });
  },
  killAll(){ this.list.forEach(p=>{ if(p.playing) this._stop(p); }); },

  byId(id){ return this.list.find(p=>p.id===id); },
  add(){ if(this.list.length>=24){toast('Max 24 pads');return;} const p=this.newPad(); this.render(); toast('Pad added'); },
  duplicate(id){ const s=this.byId(id); if(!s)return;
    const p=this.newPad({name:s.name,type:s.type,notes:[...s.notes],snapshot:s.snapshot,buffer:s.buffer,bufName:s.bufName,transpose:s.transpose,bendEnabled:s.bendEnabled});
    this.render(); toast('Pad duplicated'); },
  remove(id){ const i=this.list.findIndex(p=>p.id===id); if(i<0)return;
    const p=this.list[i]; if(p.playing)this._stop(p);
    this.list.splice(i,1); if(this.selected===id) this.selected=this.list.length?this.list[0].id:null;
    this.render(); },
  assignNotes(id,notes,name){ const p=this.byId(id); if(!p)return; this._clearMedia(p);
    p.type='notes'; p.notes=[...notes]; p.name=name||('Chord '+notes.length); p.buffer=null;
    p.snapshot=JSON.parse(JSON.stringify(E.live)); this.render(); },
  assignAudio(id,buffer,name,b64,mime){ const p=this.byId(id); if(!p)return; if(p.playing)this._stop(p); this._clearMedia(p);
    p.type='audio'; p.buffer=buffer; p.bufName=name||'audio'; p.name=(name||'audio').replace(/\.[^.]+$/,'').slice(0,16);
    if(b64!=null){ p.fileB64=b64; p.mime=mime||''; } this.render(); },
  // fallback for files the browser can't decode to PCM (e.g. some video containers): play via media element
  assignMedia(id,el,name,b64,mime){ const p=this.byId(id); if(!p)return; if(p.playing)this._stop(p); this._clearMedia(p);
    p.type='media'; p.media=el; p.bufName=name||'media'; p.name=(name||'media').replace(/\.[^.]+$/,'').slice(0,16);
    p.mime=mime||''; if(b64!=null) p.fileB64=b64;
    try{ el.loop=false; el.onended=()=>{ p.playing=false; this._paint(p); }; }catch(e){}
    if(ctx){ try{ p.mediaSrc=ctx.createMediaElementSource(el); p.mediaSrc.connect(p.bus); }catch(e){} }
    this.render(); },
  _clearMedia(p){ if(p.media){ try{p.media.pause();}catch(e){} } if(p.mediaSrc){ try{p.mediaSrc.disconnect();}catch(e){} } p.media=null; p.mediaSrc=null; },
  clearPad(id){ const p=this.byId(id); if(!p)return; if(p.playing)this._stop(p); this._clearMedia(p);
    p.type='empty'; p.notes=[]; p.buffer=null; p.fileB64=null; p.mime=''; p.name='Empty'; this.render(); },

  setPlayMode(m){ this.playMode=m; if(m!=='stack') this.killAll(); },

  _paint(pad){ const el=document.querySelector(`.pad[data-id="${pad.id}"]`); if(el) el.classList.toggle('playing',pad.playing); },

  render(){
    const win=WinMgr.open.get('pads'); if(!win)return;
    const grid=win.querySelector('#padGrid'); if(!grid)return;
    grid.style.gridTemplateColumns=`repeat(${this.cols},1fr)`;
    grid.innerHTML='';
    this.list.forEach((p,i)=>{
      const el=document.createElement('div');
      el.className='pad'+(p.type==='empty'?' empty':'')+(this.selected===p.id?' sel':'')+(p.playing?' playing':'');
      el.dataset.id=p.id;
      const meta = p.type==='audio'?'AUDIO':(p.type==='notes'?(p.notes.length+' NOTE'+(p.notes.length>1?'S':'')):'EMPTY');
      el.innerHTML=`<div class="pnum">${i+1}</div>
        <div class="pname">${p.name}</div>
        <div class="pmeta">${meta}${p.transpose?` ${p.transpose>0?'+':''}${p.transpose}st`:''} ${p.bendEnabled?'':'·NB'}</div>
        ${p.key?`<div class="pkey">${p.key}</div>`:''}`;
      el.addEventListener('pointerdown',e=>{ this.trigger(p.id); });
      el.addEventListener('click',e=>{ this.selected=p.id; this.render(); this.renderEditor(); });
      grid.appendChild(el);
    });
    this.renderEditor();
  },
  renderEditor(){
    const win=WinMgr.open.get('pads'); if(!win)return;
    const box=win.querySelector('#padEditor'); if(!box)return;
    const p=this.byId(this.selected);
    if(!p){ box.innerHTML='<div class="hint">No pad selected.</div>'; return; }
    box.innerHTML='';
    const title=document.createElement('div'); title.className='help-h'; title.textContent='Selected: '+p.name;
    box.appendChild(title);
    const row1=document.createElement('div'); row1.className='row';
    row1.innerHTML=`<label>Transpose</label>`;
    const tdn=btn('−'),tval=document.createElement('span'),tup=btn('+');
    tval.className='tb-val'; tval.textContent=(p.transpose>0?'+':'')+p.transpose+' st';
    tdn.onclick=()=>{p.transpose=Math.max(-24,p.transpose-1);tval.textContent=(p.transpose>0?'+':'')+p.transpose+' st';this.render();};
    tup.onclick=()=>{p.transpose=Math.min(24,p.transpose+1);tval.textContent=(p.transpose>0?'+':'')+p.transpose+' st';this.render();};
    row1.append(tdn,tval,tup); box.appendChild(row1);

    const row2=document.createElement('div'); row2.className='row';
    const bb=btn(p.bendEnabled?'Pitch Bend: ON':'Pitch Bend: OFF');
    if(p.bendEnabled)bb.classList.add('active');
    bb.onclick=()=>{p.bendEnabled=!p.bendEnabled; bb.textContent=p.bendEnabled?'Pitch Bend: ON':'Pitch Bend: OFF'; bb.classList.toggle('active',p.bendEnabled); this.render();};
    row2.appendChild(bb); box.appendChild(row2);

    const row3=document.createElement('div'); row3.className='pillbtns';
    const up=btn('Upload Audio'); up.onclick=()=>{ padUploadTarget=p.id; document.getElementById('padAudioFile').click(); };
    const saveSel=btn('Save Build → Pad'); saveSel.onclick=()=>{ if(buildMode.selected.size===0){toast('Build mode is empty');return;} this.assignNotes(p.id,[...buildMode.selected].sort((a,b)=>a-b),'Chord '+buildMode.selected.size); toast('Saved chord to pad'); };
    const dup=btn('Duplicate'); dup.onclick=()=>this.duplicate(p.id);
    const clr=btn('Clear'); clr.onclick=()=>this.clearPad(p.id);
    const del=btn('Delete'); del.classList.add('kill'); del.onclick=()=>this.remove(p.id);
    row3.append(up,saveSel,dup,clr,del); box.appendChild(row3);

    const hint=document.createElement('div'); hint.className='hint'; hint.style.marginTop='8px';
    hint.textContent='Tip: tap a pad to trigger it · tap once more to stop (toggle/stack). Assign EQ/FX to this pad in the EQ & Sound Design windows by setting their target to "Selected Pad".';
    box.appendChild(hint);
  }
};

/* ============================================================
   3D SPACE ENGINE
   ============================================================ */
const SpaceFX={
  points:[], idc:0, selected:null,
  PENTA:[0,3,5,7,10],
  add(){
    ensureCtx();
    if(this.points.length>=8){ toast('Max 8 sound points'); return; }
    const id='s'+(this.idc++);
    const tier=['low','mid','high'][Math.floor(Math.random()*3)];
    const baseMidi = tier==='low'? 36+Math.floor(Math.random()*7)
                   : tier==='mid'? 55+Math.floor(Math.random()*9)
                   : 72+Math.floor(Math.random()*10);
    const pc=this.PENTA[Math.floor(Math.random()*this.PENTA.length)];
    const midi=baseMidi - (baseMidi%12) + pc;
    const pt={ id, tier, midi, x:(Math.random()*1.4-0.7), y:(Math.random()*1.4-0.7),
      level: tier==='low'?0.5:tier==='high'?0.32:0.42,
      bright: tier==='high'?5200:tier==='low'?900:2200,
      shimmer: 0.15+Math.random()*0.5, detune: 6+Math.random()*16,
      nodes:null };
    this._build(pt);
    this.points.push(pt);
    this.selected=id;
    this._render();
  },
  _build(pt){
    const o=ctx.currentTime;
    const out=ctx.createGain(); out.gain.value=0;
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=pt.bright; lp.Q.value=0.6;
    const amp=ctx.createGain(); amp.gain.value=pt.level;
    // shimmer LFO on amp
    const lfo=ctx.createOscillator(); lfo.frequency.value=pt.shimmer;
    const lfoG=ctx.createGain(); lfoG.gain.value=pt.level*0.5;
    lfo.connect(lfoG); lfoG.connect(amp.gain); lfo.start();
    // three soft layers (oscillators) detuned, sine/triangle for ethereal
    const f=midiToFreq(pt.midi);
    const oscs=[];
    [[1,'sine',pt.detune],[1,'triangle',-pt.detune],[2,'sine',pt.detune*0.4]].forEach((L,i)=>{
      const osc=ctx.createOscillator(); osc.type=L[1];
      osc.frequency.value=f*L[0]; osc.detune.value=L[2];
      const g=ctx.createGain(); g.gain.value= i===2?0.25:0.5;
      osc.connect(g); g.connect(lp); osc.start(); oscs.push(osc);
    });
    lp.connect(amp);
    // 3D panner
    let pan;
    try{ pan=ctx.createPanner(); pan.panningModel='HRTF'; pan.distanceModel='inverse';
      pan.refDistance=1; pan.maxDistance=10; pan.rolloffFactor=1; }
    catch(e){ pan=ctx.createStereoPanner(); }
    amp.connect(pan);
    pan.connect(E.spacePoints); pan.connect(E.spacePointsRev);
    out.gain.setTargetAtTime(1,o,1.2); // soft fade-in
    pt.nodes={out,lp,amp,lfo,lfoG,oscs,pan};
    this._place(pt);
  },
  _place(pt){
    const n=pt.nodes; if(!n)return;
    const X=pt.x*4, Z=-pt.y*4;
    if(n.pan.positionX){ const t=ctx.currentTime;
      n.pan.positionX.setTargetAtTime(X,t,0.05);
      n.pan.positionZ.setTargetAtTime(Z,t,0.05);
      if(n.pan.positionY) n.pan.positionY.setTargetAtTime(0,t,0.05);
    } else if(n.pan.pan){ n.pan.pan.setTargetAtTime(Math.max(-1,Math.min(1,pt.x)),ctx.currentTime,0.05); }
  },
  remove(id){ const i=this.points.findIndex(p=>p.id===id); if(i<0)return;
    const p=this.points[i], n=p.nodes;
    if(n){ try{ n.amp.gain.setTargetAtTime(0,ctx.currentTime,0.2);
      n.oscs.forEach(o=>{try{o.stop(ctx.currentTime+0.5);}catch(e){}}); try{n.lfo.stop(ctx.currentTime+0.5);}catch(e){} }catch(e){} }
    this.points.splice(i,1);
    if(this.selected===id) this.selected=this.points.length?this.points[this.points.length-1].id:null;
    this._render();
  },
  byId(id){ return this.points.find(p=>p.id===id); },
  killAll(){ [...this.points].forEach(p=>this.remove(p.id)); },
  _render(){ const w=WinMgr.open.get('space'); if(w) WinMgr.registry.space.build(w.querySelector('.win-body'),w); }
};

WinMgr.registry.sound={title:'Sound Design',w:360,h:430,build(body){
  body.innerHTML='';

/* ---- EQ ---- */
function drawEQ(canvas, eq){
  const c=canvas.getContext('2d'), W=canvas.width, H=canvas.height;
  c.clearRect(0,0,W,H);
  c.strokeStyle='rgba(0,240,255,.12)'; c.lineWidth=1;
  for(let i=1;i<4;i++){ c.beginPath(); c.moveTo(0,H*i/4); c.lineTo(W,H*i/4); c.stroke(); }
  const bands=[{f:eq.low.frequency.value,g:eq.low.gain.value,type:'ls'},
               {f:eq.mid.frequency.value,g:eq.mid.gain.value,q:eq.mid.Q.value,type:'pk'},
               {f:eq.high.frequency.value,g:eq.high.gain.value,type:'hs'}];
  c.beginPath();
  for(let px=0;px<=W;px++){
    const f=20*Math.pow(1000,px/W); // 20..20k log
    let db=0;
    bands.forEach(b=>{
      if(b.type==='pk'){ const oct=Math.log2(f/b.f); db+=b.g*Math.exp(-oct*oct*(b.q||1)); }
      else { const r=f/b.f, t=b.type==='ls'?1/(1+r*r):(r*r)/(1+r*r); db+=b.g*t; }
    });
    const y=H/2 - db*(H/2/15);
    px===0?c.moveTo(px,y):c.lineTo(px,y);
  }
  c.strokeStyle='#00f0ff'; c.lineWidth=2; c.shadowColor='#00f0ff'; c.shadowBlur=8; c.stroke(); c.shadowBlur=0;
}

/* ============================================================
   PITCH BEND CONTROL
   ============================================================ */
const BendCtl={
  range:2,            // semitone range
  glide:0.18,         // seconds to traverse the FULL bend range (speed control)
  hold:false,
  norm:0,             // target wheel position -1..1 (where the user set it)
  cur:0,              // currently-applied bend in cents (animated toward target)
  target:0,           // target bend in cents
  raf:null, last:0,
  setRange(st){ this.range=st; this.target=this.norm*this.range*100; this._run(); },
  setGlide(s){ this.glide=Math.max(0,s); },
  set(norm){
    this.norm=Math.max(-1,Math.min(1,norm));
    this.target=this.norm*this.range*100;
    const grip=document.getElementById('pwGrip');
    if(grip) grip.style.top=(50 - this.norm*42)+'%'; // wheel grip tracks finger immediately
    this._run();
  },
  release(){ if(!this.hold){ this.set(0); } },
  _run(){
    if(this.raf!=null) return;            // animation already running
    this.last=performance.now();
    const step=()=>{
      const now=performance.now();
      let dt=(now-this.last)/1000; this.last=now;
      if(dt>0.1) dt=0.1;                   // clamp after tab-switch etc.
      const diff=this.target-this.cur;
      if(this.glide<=0.002){
        this.cur=this.target;
      } else {
        const fullRange=this.range*100*2;  // cents across -max..+max
        const rate=fullRange/this.glide;   // cents per second
        const stepAmt=rate*dt;
        if(Math.abs(diff)<=stepAmt) this.cur=this.target;
        else this.cur+=Math.sign(diff)*stepAmt;
      }
      if(ctx) VM.applyBend(this.cur,0);    // apply instantly each frame -> smooth ramp
      if(this.cur!==this.target){ this.raf=requestAnimationFrame(step); }
      else { this.raf=null; }
    };
    this.raf=requestAnimationFrame(step);
  }
};

const PIANO_KEYS={a:0,w:1,s:2,e:3,d:4,f:5,t:6,g:7,y:8,h:9,u:10,j:11,k:12,o:13,l:14,p:-99};
delete PIANO_KEYS.p; delete PIANO_KEYS.o; delete PIANO_KEYS.l; // keep clean 1-octave+1 set
const WIN_KEYS={'1':'sound','2':'eq','3':'pads','4':'bend','5':'space','6':'build','7':'keys','8':'theme','9':'help','0':'shortcuts'};
function compBase(){ let m=KB.startMidi; while(m%12!==0) m++; return m; } // first C at/after start
const keyDown=new Set();
function onKeyDown(e){
  if(e.repeat) return;
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='select'||tag==='textarea') return;
  const k=e.key.toLowerCase();
  // window opens with shift+digit
  if(e.shiftKey && WIN_KEYS[e.key]!==undefined){ WinMgr.toggle(WIN_KEYS[e.key]); e.preventDefault(); return; }
  // pads with digits
  if(!e.shiftKey && PAD_KEYS.includes(e.key)){ const idx=PAD_KEYS.indexOf(e.key); const p=Pads.list[idx]; if(p){ Pads.trigger(p.id); } e.preventDefault(); return; }
  switch(k){
    case 'z': adjOct(-1); return; case 'x': adjOct(1); return;
    case 'c': adjTr(-1); return; case 'v': adjTr(1); return;
    case ' ': toggleSustain(); e.preventDefault(); return;
    case 'arrowup': BendCtl.set(1); e.preventDefault(); return;
    case 'arrowdown': BendCtl.set(-1); e.preventDefault(); return;
    case 'arrowright': Pads.cycle(1); e.preventDefault(); return;
    case 'arrowleft': Pads.cycle(-1); e.preventDefault(); return;
    case 'b': BendCtl.hold=!BendCtl.hold; toast('Bend hold '+(BendCtl.hold?'ON':'OFF')); { const w=WinMgr.open.get('bend'); if(w)WinMgr.registry.bend.build(w.querySelector('.win-body'),w);} return;
    case 'p': togglePianoEnable(); return;
    case 'm': cyclePadMode(); return;
    case '`': togglePiano(); return;
    case 'backspace': killAll(); e.preventDefault(); return;
    case 'escape': { const f=document.querySelector('.win.focused'); if(f)WinMgr.close(f.dataset.type); return; }
  }
  // piano
  if(PIANO_KEYS[k]!==undefined && !e.shiftKey){
    if(keyDown.has(k))return; keyDown.add(k);
    const vmid=compBase()+PIANO_KEYS[k];
    pressVisual(vmid,sounding(vmid));
  }
}
function onKeyUp(e){
  const k=e.key.toLowerCase();
  if(k==='arrowup'||k==='arrowdown'){ BendCtl.release(); return; }
  if(PIANO_KEYS[k]!==undefined){ if(!keyDown.has(k))return; keyDown.delete(k);
    const vmid=compBase()+PIANO_KEYS[k]; releaseVisual(vmid,sounding(vmid)); }
}

/* ============================================================
   AUDIO FILE HELPERS (base64 <-> buffer, media fallback)
   ============================================================ */
function arrayBufferToB64(ab){ const bytes=new Uint8Array(ab); let bin=''; const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk){ bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk)); }
  return btoa(bin); }
function b64ToArrayBuffer(b64){ const bin=atob(b64); const len=bin.length; const bytes=new Uint8Array(len);
  for(let i=0;i<len;i++) bytes[i]=bin.charCodeAt(i); return bytes.buffer; }
function b64ToBlobUrl(b64,mime){ const buf=b64ToArrayBuffer(b64); return URL.createObjectURL(new Blob([buf],{type:mime||'application/octet-stream'})); }
function guessMime(name){ const ext=(name.split('.').pop()||'').toLowerCase();
  const m={mp3:'audio/mpeg',wav:'audio/wav',ogg:'audio/ogg',oga:'audio/ogg',m4a:'audio/mp4',aac:'audio/aac',flac:'audio/flac',opus:'audio/opus',weba:'audio/webm',
    mp4:'video/mp4',m4v:'video/mp4',mov:'video/quicktime',webm:'video/webm','3gp':'video/3gpp',avi:'video/x-msvideo',mkv:'video/x-matroska'};
  return m[ext]||''; }
function loadViaMediaElement(target,b64,mime,name){
  const isVideo=/^video\//.test(mime||'')|| /\.(mp4|mov|webm|m4v|3gp|avi|mkv)$/i.test(name||'');
  const el=document.createElement(isVideo?'video':'audio'); el.preload='auto';
  let url; try{ url=b64ToBlobUrl(b64,mime||guessMime(name)); }catch(e){ url='data:'+(mime||'audio/mpeg')+';base64,'+b64; }
  el.src=url;
  el.addEventListener('loadedmetadata',()=>{ Pads.assignMedia(target,el,name,b64,mime||guessMime(name)); toast('Loaded (stream): '+name); },{once:true});
  el.addEventListener('error',()=>{ toast('Unsupported file: '+(name||'')); },{once:true});
  if(el.load) el.load();
}
function restorePadAudio(padId,b64,mime,name,transpose,bendEnabled){
  ensureCtx(); let done=false;
  const fin=()=>{ const p=Pads.byId(padId); if(p){ p.transpose=transpose||0; p.bendEnabled=bendEnabled!==false; } Pads.render(); };
  const ok=buf=>{ if(done)return; done=true; Pads.assignAudio(padId,buf,name,b64,mime); fin(); };
  const fail=()=>{ if(done)return; done=true; loadViaMediaElement(padId,b64,mime,name); setTimeout(fin,60); };
  try{ const ab=b64ToArrayBuffer(b64); const pr=ctx.decodeAudioData(ab.slice(0),ok,fail); if(pr&&pr.then)pr.then(ok).catch(fail); }
  catch(e){ fail(); }
}

   ============================================================ */
let scopeRAF=null;
function animateHomeScope(){
  const cv=document.getElementById('homeScope'); if(!cv)return;
  const c=cv.getContext('2d'); if(!c)return;
  function resize(){ cv.width=cv.clientWidth*devicePixelRatio; cv.height=cv.clientHeight*devicePixelRatio; }
  resize(); window.addEventListener('resize',resize);
  let t=0;
  (function loop(){
    scopeRAF=requestAnimationFrame(loop); t+=0.03;
    const W=cv.width,H=cv.height; c.clearRect(0,0,W,H);
    const cols=['#00f0ff','#ff2bd6','#b6ff3a'];
    for(let layer=0;layer<3;layer++){
      c.beginPath();
      for(let x=0;x<=W;x+=4){
        const p=x/W*Math.PI*4;
        const y=H/2 + Math.sin(p+t+layer*1.4)*(H/5)*(1-layer*0.22)*(0.6+0.4*Math.sin(t*0.7+x*0.002));
        x===0?c.moveTo(x,y):c.lineTo(x,y);
      }
      c.strokeStyle=cols[layer]; c.globalAlpha=0.5-layer*0.12; c.lineWidth=2*devicePixelRatio;
      c.shadowColor=cols[layer]; c.shadowBlur=12; c.stroke();
    }
    c.globalAlpha=1; c.shadowBlur=0;
  })();
}

}

  supported(){ return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia); },
  async enable(){
