    try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:this.facing},audio:true}); }
    catch(e){ try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:this.facing},audio:false}); }
      catch(e2){ toast('Camera blocked or unavailable'); return; } }
    this.stream=stream;
    const bg=document.getElementById('camBg');
    if(bg){ bg.srcObject=stream; bg.muted=true; try{ await bg.play(); }catch(e){} bg.classList.toggle('on',this.bg); }
    if(!this.cv){ this.cv=document.createElement('canvas'); this.cv.width=this.W; this.cv.height=this.H;
      this.cctx=this.cv.getContext('2d',{willReadFrequently:true}); }
    this.prev=null; this.on=true;
    this._attachPreview();
    this._loop();
    this._syncUI();
    toast('Camera on');
  },
  disable(){
    this.on=false;
    if(this.raf){ cancelAnimationFrame(this.raf); this.raf=null; }
    if(this.recorder && this.recState){ try{this.recorder.stop();}catch(e){} }
    if(this.stream){ this.stream.getTracks().forEach(t=>{ try{t.stop();}catch(e){} }); this.stream=null; }
    const bg=document.getElementById('camBg'); if(bg){ bg.srcObject=null; bg.classList.remove('on'); }
    const pv=document.getElementById('camPreview'); if(pv) pv.srcObject=null;
    this.prev=null; this._syncUI();
    toast('Camera off');
  },
  toggle(){ this.on?this.disable():this.enable(); },
  setBackground(b){ this.bg=b; const bg=document.getElementById('camBg'); if(bg) bg.classList.toggle('on',b&&this.on); this._syncUI(); },
  async flip(){ this.facing=this.facing==='user'?'environment':'user'; if(this.on){ this.disable(); await this.enable(); } this._syncUI(); },
  setTarget(t){ this.target=t; if(t!=='pitch'&&t!=='motion') BendCtl.set(0); this._syncUI(); },
  setSens(v){ this.sens=v; },
  _attachPreview(){ const pv=document.getElementById('camPreview'); if(pv&&this.stream){ pv.srcObject=this.stream; pv.muted=true; pv.play&&pv.play().catch(()=>{}); } },
  _loop(){
    const step=()=>{
      if(!this.on) return;
      this.raf=requestAnimationFrame(step);
      const v=document.getElementById('camBg');
      if(!v||v.readyState<2){ return; }
      try{ this.cctx.drawImage(v,0,0,this.W,this.H); }catch(e){ return; }
      let cur; try{ cur=this.cctx.getImageData(0,0,this.W,this.H).data; }catch(e){ return; }
      if(this.prev){
        let sx=0,sy=0,cnt=0;
        for(let y=0;y<this.H;y++) for(let x=0;x<this.W;x++){ const i=(y*this.W+x)*4;
          const d=Math.abs(cur[i]-this.prev[i])+Math.abs(cur[i+1]-this.prev[i+1])+Math.abs(cur[i+2]-this.prev[i+2]);
          if(d>60){ sx+=x; sy+=y; cnt++; } }
        this.motion=Math.min(1, cnt/(this.W*this.H*0.4));
        if(cnt>0){ this.cx=sx/cnt/this.W; this.cy=sy/cnt/this.H; }
        this._apply();
        const dot=document.getElementById('camDot'); if(dot){ dot.style.left=((1-this.cx)*100)+'%'; dot.style.top=(this.cy*100)+'%'; dot.style.opacity=this.motion>0.02?1:0.25; }
        const rd=document.getElementById('camRead'); if(rd) rd.textContent='motion '+Math.round(this.motion*100)+'%   pos x:'+this.cx.toFixed(2)+' y:'+this.cy.toFixed(2);
      }
      this.prev=new Uint8ClampedArray(cur);
    };
    this.raf=requestAnimationFrame(step);
  },
  _apply(){
    if(this.target==='off') return;
    const s=this.sens;
    if(this.target==='pitch'){ BendCtl.set(Math.max(-1,Math.min(1,(this.cx-0.5)*2*s))); }
    else if(this.target==='motion'){ BendCtl.set(Math.max(0,Math.min(1,this.motion*2*s))); }
    else if(this.target==='bright'){ if(E.gEQ){ E.gEQ.high.gain.value=Math.max(-24,Math.min(24,(0.5-this.cy)*2*18*s)); } }
    else if(this.target==='volume'){ if(E.master){ const g=Math.max(0,Math.min(1,(1-this.cy)*s)); E.master.gain.value=g; const mv=document.getElementById('masterVol'); if(mv) mv.value=g; } }
  },
  recToPad(){
    if(!this.on||!this.stream){ toast('Enable the camera first'); return; }
    if(typeof MediaRecorder==='undefined'){ toast('Recording not supported here'); return; }
    if(this.recorder && this.recState){ try{this.recorder.stop();}catch(e){} return; }
    let mime=''; ['video/webm','video/mp4'].forEach(m=>{ if(!mime && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) mime=m; });
    let chunks=[];
    try{ this.recorder=new MediaRecorder(this.stream, mime?{mimeType:mime}:undefined); }
    catch(e){ toast('Recording not supported'); return; }
    const target=Pads.selected;
    this.recorder.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
    this.recorder.onstop=()=>{ this.recState=false; this._syncUI();
      const blob=new Blob(chunks,{type:mime||'video/webm'});
      const fr=new FileReader();
      fr.onload=()=>{ const b64=String(fr.result).split(',')[1]; loadViaMediaElement(target,b64,mime||'video/webm','cam clip'); };
      fr.readAsDataURL(blob); };
    this.recorder.start(); this.recState=true; this._syncUI();
    toast('Recording… tap “Stop → Pad” to finish');
  },
  _syncUI(){
    const set=(id,txt,act)=>{ const b=document.getElementById(id); if(b){ if(txt!=null)b.textContent=txt; if(act!=null)b.classList.toggle('active',act); } };
    set('camEnableBtn', this.on?'Camera: ON':'Enable Camera', this.on);
    set('camBgBtn', null, this.bg&&this.on);
    set('camRecBtn', this.recState?'■ Stop → Pad':'● Rec → Pad', this.recState);
    document.querySelectorAll('#camTargetSeg button').forEach(b=>b.classList.toggle('on',b.dataset.t===this.target));
    const ph=document.getElementById('camPlaceholder'); if(ph) ph.style.display=this.on?'none':'flex';
  }
};

/* ============================================================
   INIT / EVENT WIRING
   ============================================================ */
function wireResize(handle, o){
  if(!handle) return;
  let dragging=false, startVal=0, startY=0, moved=false, lastTap=0;
  handle.addEventListener('pointerdown',e=>{ dragging=true; moved=false; startY=e.clientY; startVal=o.get();
    try{handle.setPointerCapture(e.pointerId);}catch(_){ } e.preventDefault(); });
  handle.addEventListener('pointermove',e=>{ if(!dragging) return; const dy=e.clientY-startY;
    if(Math.abs(dy)>3) moved=true; o.move(startVal,dy); });
  function end(){ if(!dragging) return; dragging=false;
    if(!moved){ const now=performance.now(); if(now-lastTap<350){ o.dbl(); lastTap=0; } else lastTap=now; } }
  handle.addEventListener('pointerup',end);
  handle.addEventListener('pointercancel',()=>dragging=false);
}
function initUI(){
  // launch
  document.getElementById('launchBtn').addEventListener('click',launch);
  animateHomeScope();

  // BPM
  document.getElementById('bpmDown').onclick=()=>Tempo.set(Tempo.bpm-1);
  document.getElementById('bpmUp').onclick=()=>Tempo.set(Tempo.bpm+1);
  document.getElementById('tapTempo').onclick=()=>Tempo.tap();
  // master vol
  document.getElementById('masterVol').addEventListener('input',e=>{ if(E.master)E.master.gain.value=parseFloat(e.target.value); });
  // enhancer
  document.getElementById('enhanceAmt').addEventListener('input',e=>Enhancer.setAmt(parseFloat(e.target.value)));
  document.getElementById('enhanceToggle').onclick=()=>Enhancer.toggle();
  // project
  document.getElementById('saveProj').onclick=saveProject;
  document.getElementById('loadProj').onclick=()=>document.getElementById('projFile').click();
  document.getElementById('projFile').addEventListener('change',e=>{ const f=e.target.files[0]; if(!f)return;
    const rd=new FileReader(); rd.onload=()=>{ try{ loadProjectData(JSON.parse(rd.result)); }catch(err){ toast('Invalid project file'); } }; rd.readAsText(f); e.target.value=''; });
  // kill
  document.getElementById('killBtn').onclick=killAll;

  // dock
  document.querySelectorAll('#dock .btn[data-win]').forEach(b=>b.onclick=()=>WinMgr.toggle(b.dataset.win));

  // VIEW CONTROLS + reveal tabs
  document.getElementById('vcTop').onclick=()=>Layout.toggleTop();
  document.getElementById('vcPiano').onclick=()=>Layout.togglePiano();
  document.getElementById('vcStage').onclick=()=>Layout.toggleStage();
  document.getElementById('revealTop').onclick=()=>{ Layout.toggleStage(false); Layout.toggleTop(false); };
  document.getElementById('revealPiano').onclick=()=>{ Layout.toggleStage(false); Layout.togglePiano(false); };

  // RESIZE HANDLES (drag to resize, double-tap/click to hide)
  wireResize(document.getElementById('kbResize'),{
    get(){ const v=getComputedStyle(document.documentElement).getPropertyValue('--kb-h').trim(); return parseFloat(v)||150; },
    move(start,dy){ Layout.setKbHeight(start - dy); },   // drag UP (negative dy) => taller
    dbl(){ Layout.togglePiano(true); }
  });
  wireResize(document.getElementById('topResize'),{
    get(){ return document.getElementById('topRegion').offsetHeight; },
    move(start,dy){ Layout.setTopHeight(start + dy); },   // drag DOWN => taller
    dbl(){ Layout.toggleTop(true); }
  });

  // piano tools
  document.getElementById('togglePiano').onclick=()=>Layout.togglePiano();
  document.querySelectorAll('#viewSeg button').forEach(b=>b.onclick=()=>setView(b.dataset.view));
  document.getElementById('octDown').onclick=()=>adjOct(-1);
  document.getElementById('octUp').onclick=()=>adjOct(1);
  document.getElementById('trDown').onclick=()=>adjTr(-1);
  document.getElementById('trUp').onclick=()=>adjTr(1);
  document.getElementById('sustainBtn').onclick=toggleSustain;
  document.getElementById('pianoEnable').onclick=togglePianoEnable;

  // bank/preset
  document.getElementById('bankSel').addEventListener('change',e=>{ sel.bank=parseInt(e.target.value); sel.preset=0; fillPresets(); loadLive(); });
  document.getElementById('presetSel').addEventListener('change',e=>{ sel.preset=parseInt(e.target.value); loadLive(); });

  // pad audio / video upload (decode to PCM, else fall back to a media element)
  document.getElementById('padAudioFile').addEventListener('change',e=>{ const f=e.target.files[0]; if(!f) return;
    const target=padUploadTarget; if(target==null){ toast('Pick a pad first'); e.target.value=''; return; }
    ensureCtx();
    toast('Loading '+f.name+'…');
    const rd=new FileReader();
    rd.onerror=()=>{ toast('Could not read file'); };
    rd.onload=()=>{
      const ab=rd.result;
      const b64=arrayBufferToB64(ab);
      const mime=f.type||guessMime(f.name);
      // try true PCM decode first (best quality, exact length, no effects)
      let done=false;
      const onOK=buf=>{ if(done)return; done=true; Pads.assignAudio(target,buf,f.name,b64,mime); toast('Loaded: '+f.name); };
      const onFail=()=>{ if(done)return; done=true; loadViaMediaElement(target,b64,mime,f.name); };
      try{
        const p=ctx.decodeAudioData(ab.slice(0), onOK, onFail);
        if(p&&p.then) p.then(onOK).catch(onFail);
      }catch(err){ onFail(); }
    };
    rd.readAsArrayBuffer(f); e.target.value=''; });

  // pitch wheel drag
  const wheel=document.getElementById('pitchWheel'), grip=document.getElementById('pwGrip');
  let wd=false;
  function wheelFromY(clientY){ const r=wheel.getBoundingClientRect(); let n=((clientY-r.top)/r.height-0.5)*-2; BendCtl.set(n); }
  wheel.addEventListener('pointerdown',e=>{ wd=true; wheel.setPointerCapture(e.pointerId); wheelFromY(e.clientY); });
  wheel.addEventListener('pointermove',e=>{ if(wd)wheelFromY(e.clientY); });
  wheel.addEventListener('pointerup',()=>{ wd=false; BendCtl.release(); });
  wheel.addEventListener('pointercancel',()=>{ wd=false; BendCtl.release(); });

  // computer keyboard
  window.addEventListener('keydown',onKeyDown);
  window.addEventListener('keyup',onKeyUp);
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',initUI);
else initUI();
</script>
